<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>心屿 MindIsle · 进入心屿</title>
  <link rel="stylesheet" href="/styles.css?v=mindisle-20261108">
</head>
<body class="portal-page">
  <header class="topbar portal-topbar">
    <div class="brand">
      <div class="logo">屿</div>
      <div>
        <p class="eyebrow">MINDISLE COMPANION AGENT</p>
        <h1>心屿 · 你的心理陪伴智能体</h1>
      </div>
    </div>
    <div class="status-row">
      <span id="serviceState" class="pill warn">连接中</span>
      <span id="modelState" class="pill warn">模型读取中</span>
    </div>
  </header>

  <main class="login-shell">
    <section class="login-panel">
      <p class="panel-label">WELCOME TO MINDISLE</p>
      <h2>选择身份，进入对应工作台</h2>
      <form id="loginForm" class="login-form">
        <label>
          <span>用户名</span>
          <input id="username" value="user" autocomplete="username">
        </label>
        <label>
          <span>密码</span>
          <input id="password" value="user123" type="password" autocomplete="current-password">
        </label>
        <button class="primary full" type="submit">登录并进入</button>
        <p id="loginState" class="hint">用户：user / user123，管理员：admin / admin123</p>
      </form>
    </section>

    <section class="entry-grid" aria-label="角色入口说明">
      <article class="entry-card user-entry">
        <span class="entry-kicker">USER</span>
        <h3>用户端</h3>
        <p>专注日常心理陪伴对话、快捷表达与情绪记录。</p>
      </article>
      <article class="entry-card admin-entry">
        <span class="entry-kicker">COUNSELOR ADMIN</span>
        <h3>管理员端</h3>
        <p>面向心理辅导老师：风险报告、个案跟进、知识库维护与运营数据。</p>
      </article>
    </section>
  </main>

  <script src="/app.js?v=mindisle-20261108"></script>
</body>
</html>
